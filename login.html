<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#174C35" />
  <meta name="description" content="Sign in to Odisha 360 securely with your Google account." />
  <title>Sign in | Odisha 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">
        <span class="auth-brand-mark" aria-hidden="true">360</span>
        <span>Odisha 360</span>
      </a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="auth-eyebrow">Your Odisha journey</p>
        <h1 class="auth-title" id="login-title">Welcome</h1>
        <p class="auth-description">Sign in securely with Google to continue to your Odisha 360 profile.</p>
        <button class="google-button" id="login-google-btn" type="button">
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94a11.05 11.05 0 0 1-4.8 7.25l7.73 6C44.38 38.05 46.98 31.95 46.98 24.55z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.86.92 7.5 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.78l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
        <p class="auth-error" id="login-status" role="alert" hidden></p>
        <p class="auth-note">Your password is entered only on Google. Odisha 360 never asks for or stores your Google password.</p>
      </section>
    </main>

    <footer class="auth-footer">
      <span>© 2026 Odisha 360</span>
      <a href="index.html">Back to home</a>
    </footer>
  </div>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="auth-pages.js"></script>
</body>
</html>
